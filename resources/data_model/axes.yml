name: EMCO_Axes                     # name of the machine
machine_category: "unknown"         # category of the machine
machine_type: "unknown"             # type of the machine
machine_model: "unknown"            # model of the machine
description: "3-Axis Cartesian Movement System"
root:
  !!FolderNode
  name: Axes
  description: ""
  children:
  - !!FolderNode
    name: Variables
    description:
    children:
    - !!BooleanVariableNode
      name: Busy
      initial_value: false
    - !!FolderNode
      name: X
      children:
      - !!NumericalVariableNode
        name: CurrentPosition
        measure_unit: ""
        initial_value: 0.0
      - !!NumericalVariableNode
        name: TargetPosition
        measure_unit: ""
        initial_value: 0.0
    - !!FolderNode
      name: Y
      children:
      - !!NumericalVariableNode
        name: CurrentPosition
        measure_unit: ""
        initial_value: 0.0
      - !!NumericalVariableNode
        name: TargetPosition
        measure_unit: ""
        initial_value: 0.0
    - !!FolderNode
      name: Z
      children:
      - !!NumericalVariableNode
        name: CurrentPosition
        measure_unit: ""
        initial_value: 0.0
      - !!NumericalVariableNode
        name: TargetPosition
        measure_unit: ""
        initial_value: 0.0
  - !!FolderNode
    name: Methods
    description:
    children:
    - !!AsyncMethodNode
      name: MoveTo
      description:
      parameters:
      - !!NumericalVariableNode
        name: X_target
      - !!NumericalVariableNode
        name: Y_target
      - !!NumericalVariableNode
        name: Z_target
      returns:
      - !!BooleanVariableNode
        name: Reached