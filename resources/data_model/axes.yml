name: axes                     # name of the machine
machine_category: "unknown"         # category of the machine
machine_type: "unknown"             # type of the machine
machine_model: "unknown"            # model of the machine
description: "3-Axis Cartesian Movement System"
root:
  !!FolderNode
  name: Axes
  description: ""
  children:
  - !!FolderNode
    name: Variables
    description:
    children:
    - !!BooleanVariableNode
      name: Busy
      initial_value: false
    - !!FolderNode
      name: X
      children:
        - !!NumericalVariableNode
          name: CurrentPosition
          measure_unit: "NoneMeasureUnits.NONE"
          initial_value: 0.0
        - !!NumericalVariableNode
          name: TargetPosition
          measure_unit: "NoneMeasureUnits.NONE"
          initial_value: 0.0
    - !!FolderNode
      name: Y
      children:
        - !!NumericalVariableNode
          name: CurrentPosition
          measure_unit: "NoneMeasureUnits.NONE"
          initial_value: 0.0
        - !!NumericalVariableNode
          name: TargetPosition
          measure_unit: "NoneMeasureUnits.NONE"
          initial_value: 0.0
    - !!FolderNode
      name: Z
      children:
        - !!NumericalVariableNode
          name: CurrentPosition
          measure_unit: "NoneMeasureUnits.NONE"
          initial_value: 0.0
        - !!NumericalVariableNode
          name: TargetPosition
          measure_unit: "NoneMeasureUnits.NONE"
          initial_value: 0.0
  
  - !!FolderNode
    name: Methods
    description:
    children:
    - !!AsyncMethodNode
      name: MoveTo
      description:
      parameters:
      - !!NumericalVariableNode
        name: x
        measure_unit: "NoneMeasureUnits.NONE"
      - !!NumericalVariableNode
        name: y
        measure_unit: "NoneMeasureUnits.NONE"
      - !!NumericalVariableNode
        name: z
        measure_unit: "NoneMeasureUnits.NONE"
      returns:
      - !!BooleanVariableNode
        name: Reached
        
  - !!FolderNode
    name: CFG_Methods
    children:
    
    - !!CompositeMethodNode
      name: MoveToXYZ
      cfg:
      - !!CallMethodNode
        method: "/Axes/Methods/MoveTo"
        kwargs:
          x: 50
          y: 5
          z: 20

    - !!CompositeMethodNode
      name: MoveToXYZ0
      cfg:
      - !!CallMethodNode
        method: "/Axes/Methods/MoveTo"
        kwargs:
          x: 0
          y: 0
          z: 0
    