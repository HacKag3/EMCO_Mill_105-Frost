name: door                     # name of the machine
machine_category: "unknown"         # category of the machine
machine_type: "unknown"             # type of the machine
machine_model: "unknown"            # model of the machine
description: "Automatic Safety Enclosure Door"
root:
  !!FolderNode
  name: Door
  description: ""
  children:
  - !!FolderNode
    name: Variables
    description:
    children:
    - !!BooleanVariableNode
      name: IsClosed
      initial_value: true
    - !!BooleanVariableNode
      name: Busy
      initial_value: false
    - !!NumericalVariableNode
      name: Time
      description: "Time required to complete an open/close operation"
      measure_unit: "NoneMeasureUnits.NONE"
      initial_value: 0.0
  - !!FolderNode
    name: Methods
    description:
    children:
    - !!AsyncMethodNode
      name: OpenClose
      description:
      parameters:
      - !!BooleanVariableNode
        name: wannaClose
        description: "false to open, true to close"
      returns:
      - !!BooleanVariableNode
        name: Success
        
  - !!FolderNode
    name: CFG_Methods
    children:

    - !!CompositeMethodNode
      name: OpenDoor
      cfg:
      - !!CallMethodNode
        method: "/Door/Methods/OpenClose"
        kwargs:
          wannaClose: false

    - !!CompositeMethodNode
      name: CloseDoor
      cfg:
      - !!CallMethodNode
        method: "/Door/Methods/OpenClose"
        kwargs:
          wannaClose: true