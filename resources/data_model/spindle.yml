name: spindle                # name of the machine
machine_category: "unknown"         # category of the machine
machine_type: "unknown"             # type of the machine
machine_model: "unknown"            # model of the machine
description: "Spindle DC Motor" 
root:
  !!FolderNode
  name: DCMotor
  description: ""
  children:
  - !!FolderNode
    name: Variables
    description:
    children:
    - !!BooleanVariableNode
      name: Busy
      initial_value: false
    - !!NumericalVariableNode
      name: CurrentRPM
      measure_unit: "NoneMeasureUnits.NONE"
      initial_value: 0.0
    - !!NumericalVariableNode
      name: TargetRPM
      measure_unit: "NoneMeasureUnits.NONE"
      initial_value: 0.0
  - !!FolderNode
    name: Methods
    description:
    children:
    - !!AsyncMethodNode
      name: ChangeSpeed
      description:
      parameters:
      - !!NumericalVariableNode
        name: targetSpeed
      returns:
      - !!BooleanVariableNode
        name: Reached

  - !!FolderNode
    name: CFG_Method
    children:

    - !!CompositeMethodNode
      name: GoToSpeed0
      cfg:
      - !!CallMethodNode
        method: "/DCMotor/Methods/ChangeSpeed"
        kwargs:
          targetSpeed: 0

    - !!CompositeMethodNode
      name: GoToSpeed500
      cfg:
      - !!CallMethodNode
        method: "/DCMotor/Methods/ChangeSpeed"
        kwargs:
          targetSpeed: 500