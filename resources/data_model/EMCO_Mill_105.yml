name: milling_machine         # name of the machine
machine_category: unknown   # category of the machine
machine_type: unknown       # type of the machine
machine_model: unknown      # model of the machine
description: ''             # description of the machine
root: 
  !!FolderNode
  name: MillingMachine
  description:
  children:

  - !!FolderNode
    name: Variables
    description:
    children:
    - !!BooleanVariableNode
      name: Busy
      initial_value: false
  
  - !!FolderNode
    name: Methods
    description:
    children:
    - !!AsyncMethodNode
      name: CalculateBusy
      description:
      parameters:
      - !!BooleanVariableNode
        name: door
      - !!BooleanVariableNode
        name: tt
      - !!BooleanVariableNode
        name: dcm
      - !!BooleanVariableNode
        name: axes
    
    - !!CompositeMethodNode
      name: CheckBusy
      cfg:
      - !!ReadRemoteVariableNode
        variable: "/Door/Variables/Busy"
        remote_id: "door"
        store_as: "door_busy"
      - !!ReadRemoteVariableNode
        variable: "/ToolTurret/Variables/Busy"
        remote_id: "tool_turret"
        store_as: "tt_busy"
      - !!ReadRemoteVariableNode
        variable: "/DCMotor/Variables/Busy"
        remote_id: "spindle"
        store_as: "dcm_busy"
      - !!ReadRemoteVariableNode
        variable: "/Axes/Variables/Busy"
        remote_id: "axes"
        store_as: "axes_busy"
      - !!CallMethodNode
        method: "/MillingMachine/Methods/CalculateBusy"
        kwargs:
          door: "${door_busy}"
          tt: "${tt_busy}"
          dcm: "${dcm_busy}"
          axes: "${axes_busy}"
    