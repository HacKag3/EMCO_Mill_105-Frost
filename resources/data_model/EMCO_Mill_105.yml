name: EMCO_Mill_105         # name of the machine
machine_category: unknown   # category of the machine
machine_type: unknown       # type of the machine
machine_model: unknown      # model of the machine
description: ''             # description of the machine
root: 
  !!FolderNode
  name: MillingMachine
  description:
  children:

  - !!BooleanVariableNode
    name: Busy
    initial_value: false
  
  - !!FolderNode
    name: Methods
    description:
    children:
    - !!CompositeMethod
      name: StartTask
      description:
      parameters:
      - !!NumericalVariableNode
        name: TargetToolID
      - !!NumericalVariableNode
        name: TargetSpeed
      - !!NumericalVariableNode
        name: X_target
      - !!NumericalVariableNode
        name: Y_target
      - !!NumericalVariableNode
        name: Z_target
      returns:
      - !!BooleanVariableNode
        name: Done

      cfg:
      - !!WriteVariableNode
        variable: "/MillingMachine/Busy"
        value: true

      - !!CallMethodNode
        method: "/Door/Methods/OpenClose"
        kwargs:
          wannaClose: true
      - !!WaitConditionNode
        variable: "/Door/Variables/IsClosed"
        operator: "=="
        rhs: true

      - !!CallMethodNode
        method: "/ToolTurret/Methods/Change"
        kwargs:
          TargetToolID: 1
      - !!WaitConditionNode
        variable: "/ToolTurret/Variables/IsChanging"
        operator: "=="
        rhs: false

      - !!CallMethodNode
        method: "/DCMotor/Methods/ChangeSpeed"
        kwargs:
          TargetSpeed: 100
      - !!WaitConditionNode
        variable: "/Axes/Variables/TargetRPM"
        operator: "=="
        rhs: 100

      - !!CallMethodNode
        method: "/Axes/Methods/MoveTo"
        kwargs:
          X_target: 1
          Y_target: 1
          Z_target: 1
      - !!WaitConditionNode
        variable: "/Axes/Variables/Busy"
        operator: "=="
        rhs: false

      - !!CallMethodNode
        method: "/DCMotor/Methods/ChangeSpeed"
        kwargs:
          TargetSpeed: 0
      - !!WaitConditionNode
        variable: "/Axes/Variables/Busy"
        operator: "=="
        rhs: false

      - !!CallMethodNode
        method: "/Door/Methods/OpenClose"
        kwargs:
          wannaClose: false
      - !!WaitConditionNode
        variable: "/Door/Variables/IsClosed"
        operator: "=="
        rhs: true

      - !!WriteVariableNode
        variable: "/MillingMachine/Busy"
        value: false
    