name: EMCO_Mill_105         # name of the machine
machine_category: unknown   # category of the machine
machine_type: unknown       # type of the machine
machine_model: unknown      # model of the machine
description: ''             # description of the machine
root: 
  !!FolderNode
  name: MillingMachine
  description:
  children:

  - !!BooleanVariableNode
    name: Busy
    initial_value: false

  - !!FolderNode
    name: Door
    description: "Automatic Safety Door"
    children:
    - !!FolderNode
      name: Variables
      description:
      children:
      - !!BooleanVariableNode
        name: IsClosed
        initial_value: true
      - !!BooleanVariableNode
        name: Busy
        initial_value: false
      - !!NumericalVariableNode
        name: Time
        description: "Time required to complete an open/close operation"
        measure_unit: "NoneMeasureUnits.NONE"
        initial_value: 0.0
    - !!FolderNode
      name: Methods
      description:
      children:
      - !!AsyncMethodNode
        name: OpenClose
        description:
        parameters:
        - !!BooleanVariableNode
          name: wannaClose
          description: "false to open, true to close"
        returns:
        - !!BooleanVariableNode
          name: Success

  - !!FolderNode
    name: ToolTurret
    description: "10-Station Tool turret"
    children:
    - !!FolderNode
      name: Variables
      description:
      children:
      - !!BooleanVariableNode
        name: Busy
        initial_value: false
      - !!NumericalVariableNode
        name: CurrentTool
        measure_unit: "NoneMeasureUnits.NONE"
        initial_value: 0
      - !!NumericalVariableNode
        name: TargetTool
        measure_unit: "NoneMeasureUnits.NONE"
        initial_value: 0
      - !!NumericalVariableNode
        name: TotalStations
        measure_unit: "NoneMeasureUnits.NONE"
        initial_value: 10
      - !!NumericalVariableNode
        name: Time
        description: "Time needed to switch between two adjacent stations"
        measure_unit: "NoneMeasureUnits.NONE"
        initial_value: 0.0
    - !!FolderNode
      name: Methods
      description:
      children:
      - !!AsyncMethodNode
        name: Change
        description:
        parameters: 
        - !!NumericalVariableNode
          name: targetTool
          measure_unit: "NoneMeasureUnits.NONE"
        returns:
        - !!BooleanVariableNode
          name: Success
  
  - !!FolderNode
    name: DCMotor
    description: "Spindle DC Motor"
    children:
    - !!FolderNode
      name: Variables
      description:
      children:
      - !!BooleanVariableNode
        name: Busy
        initial_value: false
      - !!NumericalVariableNode
        name: CurrentRPM
        measure_unit: "NoneMeasureUnits.NONE"
        initial_value: 0.0
      - !!NumericalVariableNode
        name: TargetRPM
        measure_unit: "NoneMeasureUnits.NONE"
        initial_value: 0.0
    - !!FolderNode
      name: Methods
      description:
      children:
      - !!AsyncMethodNode
        name: ChangeSpeed
        description:
        parameters:
        - !!NumericalVariableNode
          name: targetSpeed
        returns:
        - !!BooleanVariableNode
          name: Reached

  - !!FolderNode
    name: Axes
    description: "3-Axis Cartesian Movement System"
    children:
    - !!FolderNode
      name: Variables
      description:
      children:
      - !!BooleanVariableNode
        name: Busy
        initial_value: false
      - !!FolderNode
        name: X
        children:
          - !!NumericalVariableNode
            name: CurrentPosition
            measure_unit: "NoneMeasureUnits.NONE"
            initial_value: 0.0
          - !!NumericalVariableNode
            name: TargetPosition
            measure_unit: "NoneMeasureUnits.NONE"
            initial_value: 0.0
      - !!FolderNode
        name: Y
        children:
          - !!NumericalVariableNode
            name: CurrentPosition
            measure_unit: "NoneMeasureUnits.NONE"
            initial_value: 0.0
          - !!NumericalVariableNode
            name: TargetPosition
            measure_unit: "NoneMeasureUnits.NONE"
            initial_value: 0.0
      - !!FolderNode
        name: Z
        children:
          - !!NumericalVariableNode
            name: CurrentPosition
            measure_unit: "NoneMeasureUnits.NONE"
            initial_value: 0.0
          - !!NumericalVariableNode
            name: TargetPosition
            measure_unit: "NoneMeasureUnits.NONE"
            initial_value: 0.0
    - !!FolderNode
      name: Methods
      description:
      children:
      - !!AsyncMethodNode
        name: MoveTo
        description:
        parameters:
        - !!NumericalVariableNode
          name: x
          measure_unit: "NoneMeasureUnits.NONE"
        - !!NumericalVariableNode
          name: y
          measure_unit: "NoneMeasureUnits.NONE"
        - !!NumericalVariableNode
          name: z
          measure_unit: "NoneMeasureUnits.NONE"
        returns:
        - !!BooleanVariableNode
          name: Reached


  - !!FolderNode
    name: CFG_Method
    children:

    - !!CompositeMethodNode
      name: OpenDoor
      cfg:
      - !!CallMethodNode
        method: "/MillingMachine/Door/Methods/OpenClose"
        kwargs:
          wannaClose: false
      - !!WaitConditionNode
        variable: "/MillingMachine/Door/Variables/Busy"
        operator: "=="
        rhs: false

    - !!CompositeMethodNode
      name: CloseDoor
      cfg:
      - !!CallMethodNode
        method: "/MillingMachine/Door/Methods/OpenClose"
        kwargs:
          wannaClose: true
      - !!WaitConditionNode
        variable: "/MillingMachine/Door/Variables/Busy"
        operator: "=="
        rhs: false

    - !!CompositeMethodNode
      name: ChangeTool1
      cfg:
      - !!CallMethodNode
        method: "/MillingMachine/ToolTurret/Methods/Change"
        kwargs:
          targetTool: 1
      - !!WaitConditionNode
        variable: "/MillingMachine/ToolTurret/Variables/Busy"
        operator: "=="
        rhs: false

    - !!CompositeMethodNode
      name: GoToSpeed0
      cfg:
      - !!CallMethodNode
        method: "/MillingMachine/DCMotor/Methods/ChangeSpeed"
        kwargs:
          targetSpeed: 0
      - !!WaitConditionNode
        variable: "/MillingMachine/DCMotor/Variables/Busy"
        operator: "=="
        rhs: false

    - !!CompositeMethodNode
      name: GoToSpeed500
      cfg:
      - !!CallMethodNode
        method: "/MillingMachine/DCMotor/Methods/ChangeSpeed"
        kwargs:
          targetSpeed: 500
      - !!WaitConditionNode
        variable: "/MillingMachine/DCMotor/Variables/Busy"
        operator: "=="
        rhs: false

    - !!CompositeMethodNode
      name: MoveToXYZ
      cfg:
      - !!CallMethodNode
        method: "/MillingMachine/Axes/Methods/MoveTo"
        kwargs:
          x: 50
          y: 5
          z: 20
      - !!WaitConditionNode
        variable: "/MillingMachine/Axes/Variables/Busy"
        operator: "=="
        rhs: false

    - !!CompositeMethodNode
      name: MoveToXYZ
      cfg:
      - !!CallMethodNode
        method: "/MillingMachine/Axes/Methods/MoveTo"
        kwargs:
          x: 0
          y: 0
          z: 0
      - !!WaitConditionNode
        variable: "/MillingMachine/Axes/Variables/Busy"
        operator: "=="
        rhs: false
    