name: EMCO_Tool_Turret              # name of the machine
machine_category: "unknown"         # category of the machine
machine_type: "unknown"             # type of the machine
machine_model: "unknown"            # model of the machine
description: "Tool turret with 10 stations"
root:
  !!FolderNode
  name: ToolTurret
  description: ""
  children:
  - !!FolderNode
    name: Variables
    description:
    children:
    - !!BooleanVariableNode
      name: IsChanging
      initial_value: false
    - !!NumericalVariableNode
      name: CurrentTool
      measure_unit: ""
      initial_value: 0
    - !!NumericalVariableNode
      name: TargetTool
      measure_unit: ""
      initial_value: 0
    - !!NumericalVariableNode
      name: TotalStations
      measure_unit: ""
      initial_value: 10
    - !!NumericalVariableNode
      name: Time
      description: "Time needed to switch between two adjacent stations"
      measure_unit: ""
      initial_value: 0.0
  - !!FolderNode
    name: Methods
    description:
    children:
    - !!AsyncMethodNode
      name: Change
      description:
      parameters: 
      - !!NumericalVariableNode
        name: TargetToolID
      returns:
      - !!BooleanVariableNode
        name: Success